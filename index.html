<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAJCO Subcontractor Performance Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style id="app-css">:root{
  --bg:#EEF3EC; --surface:#FFFFFF; --surface-2:#F6F9F5; --ink:#12231A; --muted:#566B5E; --line:#D5E0D6;
  --brand:#1B7A35; --brand-deep:#0C4A23; --brand-soft:#E1F0E3; --on-brand:#FFFFFF;
  --gold:#D4AE12; --gold-soft:#FBF4D3;
  --crit:#C62828; --crit-soft:#FBE3E1; --warn:#B86A00; --warn-soft:#FDEBCB; --info:#2563A8; --info-soft:#DEEBF8; --ok:#1B7A35;
  --rev:#2F62D0; --invc:#5B2FB5; --contract:#0C4A23; --invbar:#6BBF7D;
  --a1:#1B7A35; --a2:#D4AE12; --a3:#2F62D0; --a4:#C2410C; --a5:#7C3AED; --a6:#0E8A8A;
  --shadow:0 1px 2px rgba(12,74,35,.08),0 6px 18px -8px rgba(12,74,35,.18);
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B130E; --surface:#121E17; --surface-2:#172619; --ink:#E7F0E9; --muted:#9DB2A4; --line:#25392C;
    --brand:#4DBB69; --brand-deep:#0F3D1F; --brand-soft:#173824; --on-brand:#08140C;
    --gold:#E6C230; --gold-soft:#3A3210;
    --crit:#FF7B72; --crit-soft:#3C1A1A; --warn:#F0A940; --warn-soft:#3A2B10; --info:#7FB2F0; --info-soft:#142A44; --ok:#4DBB69;
    --rev:#7BA5FF; --invc:#B49CFF; --contract:#2F9650; --invbar:#8FD9A0;
    --a1:#4DBB69; --a2:#E6C230; --a3:#7BA5FF; --a4:#FF9060; --a5:#B49CFF; --a6:#4FD1C5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0B130E; --surface:#121E17; --surface-2:#172619; --ink:#E7F0E9; --muted:#9DB2A4; --line:#25392C;
  --brand:#4DBB69; --brand-deep:#0F3D1F; --brand-soft:#173824; --on-brand:#08140C;
  --gold:#E6C230; --gold-soft:#3A3210;
  --crit:#FF7B72; --crit-soft:#3C1A1A; --warn:#F0A940; --warn-soft:#3A2B10; --info:#7FB2F0; --info-soft:#142A44; --ok:#4DBB69;
  --rev:#7BA5FF; --invc:#B49CFF; --contract:#2F9650; --invbar:#8FD9A0;
  --a1:#4DBB69; --a2:#E6C230; --a3:#7BA5FF; --a4:#FF9060; --a5:#B49CFF; --a6:#4FD1C5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{background:linear-gradient(100deg,var(--brand-deep) 0%,#145C2B 60%,#1B7A35 100%);color:#fff;padding:14px clamp(14px,3vw,32px)}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.logo img{width:56px;height:56px;display:block}
.titles{flex:1;min-width:220px}
.titles h1{margin:0;font-size:clamp(17px,2.4vw,24px);font-weight:700;line-height:1.25}
.titles p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.month-pill{background:var(--gold);color:#2b2300;font-weight:700;padding:7px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.month-pill small{font-weight:500;opacity:.8;margin-inline-end:6px}
.ibtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;min-height:34px}
.ibtn:hover{background:rgba(255,255,255,.26)}

/* nav */
.nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.nav-in{max-width:1440px;margin:0 auto;display:flex;gap:2px;padding:0 clamp(10px,3vw,32px);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink)}
.badge{background:var(--crit);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.tab-inputs{margin-inline-start:auto}
.tab-inputs .tag{font-size:11px;font-weight:500;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px}

main{max-width:1440px;margin:0 auto;padding:16px clamp(10px,3vw,32px) 30px}
.view[hidden]{display:none}

/* filter bar */
.fbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fbar .lbl{font-weight:700;color:var(--brand-deep);font-size:13px}
:root[data-theme="dark"] .fbar .lbl{color:var(--brand)}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
details.dd{position:relative}
details.dd>summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 12px;font-size:13px}
details.dd>summary::-webkit-details-marker{display:none}
.dd-p{position:absolute;z-index:30;inset-inline-start:0;top:110%;width:min(380px,86vw);max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px}
.dd-p label{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.dd-p label:hover{background:var(--surface-2)}
.dd-p input{margin-top:3px;accent-color:var(--brand)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.panel>h2,.panel>.ph{margin:0;background:var(--brand);color:#fff;font-size:15px;font-weight:700;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
:root[data-theme="dark"] .panel>h2,:root[data-theme="dark"] .panel>.ph{background:var(--brand-deep);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel>h2,:root:not([data-theme="light"]) .panel>.ph{background:var(--brand-deep);color:var(--ink)}}
.panel .pb{padding:12px 14px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g-main,.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.top-in{gap:10px}.logo{width:52px;height:52px}.logo img{width:46px;height:46px}}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.kpi-h{background:var(--brand);color:#fff;text-align:center;font-weight:700;padding:6px 8px;font-size:14px;line-height:1.3;min-height:44px;display:grid;place-items:center}
:root[data-theme="dark"] .kpi-h{background:var(--brand-deep);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi-h{background:var(--brand-deep);color:var(--ink)}}
.kpi-b{padding:10px 8px 12px;text-align:center;flex:1}
.kpi-s{font-size:12px;color:var(--muted)}
.kpi-v{font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.2;margin-top:4px}
.kpi-d{font-size:12px;margin-top:2px;color:var(--muted)}
.kpi-d .up{color:var(--ok);font-weight:600}.kpi-d .dn{color:var(--crit);font-weight:600}
.kpi.gold{border:2px solid var(--gold)}
.kpi.gold .kpi-v{color:#8A6D00}
:root[data-theme="dark"] .kpi.gold .kpi-v{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi.gold .kpi-v{color:var(--gold)}}
.kpi.hero{border:2px solid var(--brand-deep);background:var(--brand-soft)}
.kpi.hero .kpi-v{color:var(--brand);font-size:clamp(30px,4vw,44px)}
.kpi.hero .kpi-note{font-size:12px;line-height:1.5;padding:0 10px 10px;text-align:center}
.meter{height:8px;border-radius:99px;background:var(--line);margin:8px 14px 4px;position:relative;overflow:visible}
.meter i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.meter b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);inset-inline-start:50%}

/* tables */
.tw{overflow:auto;max-height:430px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--brand);color:#fff;font-weight:700;padding:7px 10px;text-align:start;white-space:nowrap;cursor:pointer;z-index:2;user-select:none}
:root[data-theme="dark"] th{background:var(--brand-deep);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{background:var(--brand-deep);color:var(--ink)}}
th.nosort{cursor:default}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--surface-2)}
td.n,th.n{text-align:end;white-space:nowrap}
td.nm{max-width:300px}
tfoot td{position:sticky;bottom:0;background:var(--brand-soft);font-weight:700;border-top:2px solid var(--brand)}
.effc{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.effb{width:54px;height:6px;border-radius:9px;background:var(--line);overflow:hidden;flex:none}
.effb i{display:block;height:100%;background:var(--brand)}
.effb i.low{background:var(--crit)}
.neg{color:var(--crit);font-weight:600}.pos{color:var(--ok);font-weight:600}
.flag{display:inline-block;background:var(--crit);color:#fff;border-radius:5px;padding:1px 8px;font-size:12px;font-weight:700}
.sev{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;flex:none}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.ok{background:var(--brand-soft);color:var(--ok)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search,.sel,.num{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;min-height:32px}
.ph .search{background:rgba(255,255,255,.95);color:#12231A;border:0;width:170px}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:38px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink);font-family:var(--font)}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .lv{font-size:11px;font-weight:600}
.chart .gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-bottom:6px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-2px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.hb-row .nm{font-size:12.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-bar{display:flex;align-items:center;gap:8px;font-size:12px}
.hb-bar>span{height:11px;border-radius:3px;display:block;min-width:2px}
.hb-bar .c{background:var(--contract)}.hb-bar .i{background:var(--invbar)}

/* checks */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;text-align:start}
.sbox .v{font-size:26px;font-weight:700;line-height:1.1}
.sbox.crit .v{color:var(--crit)}.sbox.warn .v{color:var(--warn)}.sbox.info .v{color:var(--info)}
.sbox[aria-pressed="true"]{outline:2px solid var(--gold)}
details.area{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
details.area>summary{cursor:pointer;list-style:none;padding:10px 14px;background:var(--brand-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
details.area>summary::-webkit-details-marker{display:none}
details.area>summary .sp{flex:1}
.proj{padding:8px 12px 12px}
.proj h4{margin:8px 0 6px;font-size:13.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.proj h4 .pn{color:var(--muted);font-weight:500}
.issue-t{display:flex;align-items:flex-start}
.issue-t small{display:block;color:var(--muted);font-size:11.5px}
.fcheck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.fcheck:last-child{border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}

/* inputs */
.drop{border:2px dashed var(--brand);border-radius:12px;background:var(--brand-soft);padding:26px;text-align:center;cursor:pointer}
.drop.over{background:var(--gold-soft);border-color:var(--gold)}
.drop strong{display:block;font-size:16px;margin-bottom:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.log{font-size:12.5px;margin-top:8px}
.log div{padding:2px 0}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:12.5px}

footer{border-top:1px solid var(--line);background:var(--surface);padding:14px clamp(14px,3vw,32px);text-align:center;color:var(--muted);font-size:13px}
footer b{color:var(--ink)}
.toast{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:80vw;font-size:13px}
@media print{.nav,.fbar,.ibtn,.tab-inputs{display:none!important}.tw{max-height:none}body{background:#fff}}

[hidden]{display:none!important}

.help{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--brand);border-radius:10px;padding:10px 14px}
.help p{margin:5px 0;line-height:1.6}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
</style>
</head>

/* ---------- model ---------- */
var M=null;

  var byMonth={},dups=[];

  var months=Object.keys(byMonth).sort();
  var data={},pinfo={};
  months.forEach(function(mo){
    var f=byMonth[mo],map=new Map(),seen={};
    f.rows.forEach(function(r){
      var pi=f.projs[r[0]]||['',''];pinfo[r[0]]={pn:pi[0]||(pinfo[r[0]]&&pinfo[r[0]].pn)||'',a:pi[1]||(pinfo[r[0]]&&pinfo[r[0]].a)||''};
      var k=r[0]+'|'+keyOf(r[1]);var e=map.get(k);
      if(!e){e={k:k,p:r[0],a:pinfo[r[0]].a,s:stem(r[1]),c:0,rc:0,i:0,rw:0,lines:0,dup:0};map.set(k,e)}
      e.c+=r[2];e.rc+=r[3];e.i+=r[4];e.rw+=r[5];e.lines++;
      var dk=r[0]+'|'+r[1]+'|'+r[2]+'|'+r[4]+'|'+r[5];
      if(r[4]>0){if(seen[dk])e.dup++;seen[dk]=1}
    });

  });

  if(!M.months.length)M.ri=-1;

}

/* ---------- checks ---------- */
function runChecks(mi){

    if(e.c<=0&&e.i>tol)push('INV_NO_CONTRACT',e,{ref:e.c,cur:e.i,diff:e.i});
    if(e.rc>0&&e.rw>e.rc+tol)push('RW_GT_RC',e,{ref:e.rc,cur:e.rw,diff:e.rw-e.rc});
    if(e.i>tol&&e.rw>tol&&e.i>e.rw+tol)push('INV_GT_REVW',e,{ref:e.rw,cur:e.i,diff:e.i-e.rw});
    if(e.i>tol&&e.rw<=tol)push('INV_NO_REV',e,{ref:e.rw,cur:e.i,diff:e.i});
    if(e.c>tol&&e.rc<=tol)push('NO_REV_BASE',e,{});

        if(e.rw<pe.rw-tol)push('RW_DEC',e,{ref:pe.rw,cur:e.rw,diff:e.rw-pe.rw});

function totalsOf(mo){var a={c:0,rc:0,i:0,rw:0};M.data[mo].forEach(function(e){a.c+=e.c;a.rc+=e.rc;a.i+=e.i;a.rw+=e.rw});return a}

function smoothPath(pts){var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],m=(a[0]+b[0])/2;d+=' C'+m.toFixed(1)+' '+a[1].toFixed(1)+','+m.toFixed(1)+' '+b[1].toFixed(1)+','+b[0].toFixed(1)+' '+b[1].toFixed(1)}return d}

    h+='<details class="area"'+(first||cc.crit?' open':'')+'><summary><span>'+esc(areaName(a))+'</span><span class="sp"></span>'+['crit','warn','info'].map(function(s){return cc[s]?'<span class="pill '+s+'">'+cc[s]+' '+esc(t(s))+'</span>':''}).join('')+'</summary>';first=false;
    Object.keys(byA[a]).sort().forEach(function(p){
      h+='<div class="proj"><h4><span>'+p+'</span><span class="pn" dir="auto">'+esc(pname(p))+'</span><span class="pill ok">'+byA[a][p].length+' '+esc(t('issues'))+'</span></h4><div style="overflow:auto"><table><thead><tr><th class="nosort">'+esc(t('colIssue'))+'</th><th class="nosort">'+esc(t('sc'))+'</th><th class="nosort n">'+esc(t('colRef'))+'</th><th class="nosort n">'+esc(t('colCur'))+'</th><th class="nosort n">'+esc(t('colDiff'))+'</th></tr></thead><tbody>';
      byA[a][p].forEach(function(x){
        var rl=refLabel(x),df=x.diff==null?'':x.code==='HIGH_EFF'?fP(x.diff):fD(x.diff);
        h+='<tr><td><div class="issue-t"><span class="sev '+x.sev+'"></span><span>'+esc(T[S.lang].c[x.code][0])+(rl?'<small>'+esc(rl)+'</small>':'')+'</span></div></td><td class="nm" dir="auto">'+(x.s?esc(x.s):'<span class="hint">'+esc(t('projLevel'))+'</span>')+'</td><td class="n">'+(x.ref==null?'':f0(x.ref))+'</td><td class="n">'+(x.cur==null?'':f0(x.cur))+'</td><td class="n '+(x.diff!=null&&x.diff<0&&x.code!=='HIGH_EFF'?'neg':'')+'">'+df+'</td></tr>'});
      h+='</tbody></table></div></div>'});
    h+='</details>'});
  box.innerHTML=h;
}

function cxText(code,i){return T[S.lang].cx[code][i].replace('{spike}',S.cfg.spike).replace('{hiEff}',S.cfg.hiEff)}
function renderCheckHelp(){
  var box=$('#chkHelp');if(!box)return;var c=S.chk.code,h='';
  if(c){h='<div class="help"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill '+SEV[c]+'">'+esc(t(SEV[c]))+'</span><b>'+esc(T[S.lang].c[c][0])+'</b></div><p><b>'+esc(t('cWhat'))+':</b> '+esc(cxText(c,0))+'</p><p><b>'+esc(t('cWhy'))+':</b> '+esc(cxText(c,1))+'</p></div>'}
  else{
    h='<details class="area"><summary><span>'+esc(t('cGuide'))+'</span></summary><div class="proj"><div class="help" style="margin-bottom:10px"><b>'+esc(t('cLevels'))+'</b><p><span class="pill crit">'+esc(t('crit'))+'</span> '+esc(t('lvCrit'))+'</p><p><span class="pill warn">'+esc(t('warn'))+'</span> '+esc(t('lvWarn'))+'</p><p><span class="pill info">'+esc(t('info'))+'</span> '+esc(t('lvInfo'))+'</p></div><div class="guide">';
    Object.keys(SEV).sort(function(a,b){return SEV_ORDER[SEV[a]]-SEV_ORDER[SEV[b]]}).forEach(function(c){h+='<div class="help"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill '+SEV[c]+'">'+esc(t(SEV[c]))+'</span><b>'+esc(T[S.lang].c[c][0])+'</b></div><p><b>'+esc(t('cWhat'))+':</b> '+esc(cxText(c,0))+'</p><p><b>'+esc(t('cWhy'))+':</b> '+esc(cxText(c,1))+'</p></div>'});
    h+='</div></div></details>'}
  box.innerHTML=h;
}
/* ---------- inputs ---------- */
function renderInputs(){
  var el=$('#v-inputs');if(VIEWER){el.innerHTML='';return}
  var h='<div class="note" style="margin-bottom:14px">'+esc(t('iNote'))+'</div>';
  h+='<div class="panel" style="margin-bottom:14px"><h2>'+esc(t('iTitle'))+'</h2><div class="pb"><div class="drop" id="drop" tabindex="0" role="button"><strong>'+esc(t('iDrop'))+'</strong><span class="hint">'+esc(t('iDrop2'))+'</span></div><input type="file" id="fin" accept=".xlsx,.xlsm,.xls,.json" multiple hidden><div class="log" id="log"></div></div></div>';
  h+='<div class="panel" style="margin-bottom:14px"><h2>'+esc(t('iFiles'))+' ('+S.files.length+')</h2><div class="tw">';
  if(!S.files.length)h+='<div class="empty">'+esc(t('iNoFiles'))+'</div>';
  else{h+='<table><thead><tr><th class="nosort">'+esc(t('iFile'))+'</th><th class="nosort">'+esc(t('iMonth'))+'</th><th class="nosort n">'+esc(t('iRows'))+'</th><th class="nosort">'+esc(t('iStatus'))+'</th><th class="nosort"></th></tr></thead><tbody>';
    S.files.forEach(function(f,i){
      var warn=f.stats.colMonth&&f.stats.nameMonth&&f.stats.colMonth!==f.stats.nameMonth;
      h+='<tr><td dir="ltr" style="text-align:start">'+esc(f.name)+'</td><td><input type="month" class="num" value="'+f.month+'" data-chg="fmonth" data-i="'+i+'"></td><td class="n">'+f.stats.n+'</td><td>'+(warn?'<span class="pill warn">'+esc(t('warn'))+'</span>':f.stats.colMonth?'<span class="pill ok">'+esc(t('iOk'))+'</span>':'<span class="pill info">'+esc(t('iMonthFix'))+'</span>')+'</td><td><button class="btn sec" data-act="rm:'+i+'">'+esc(t('iRemove'))+'</button></td></tr>'});
    h+='</tbody></table>'}
  h+='</div></div>';
  var months=M.months;
  h+='<div class="panel" style="margin-bottom:14px"><h2>'+esc(t('iReportMonth'))+' / '+esc(t('iSettings'))+'</h2><div class="pb"><div class="form"><label>'+esc(t('iReportMonth'))+'<select class="sel" data-chg="rmonth">'+months.map(function(m){return '<option value="'+m+'"'+(M.ri>=0&&M.months[M.ri]===m?' selected':'')+'>'+esc(monthLabel(m))+'</option>'}).join('')+'</select></label>';
  h+='<label>'+esc(t('iSpike'))+'<input class="num" type="number" min="1" max="100" value="'+S.cfg.spike+'" data-chg="cfg" data-k="spike"></label><label>'+esc(t('iHiEff'))+'<input class="num" type="number" min="100" max="2000" step="50" value="'+S.cfg.hiEff+'" data-chg="cfg" data-k="hiEff"></label><label>'+esc(t('iStall'))+'<input class="num" type="number" min="2" max="12" value="'+S.cfg.stall+'" data-chg="cfg" data-k="stall"></label></div></div></div>';
  h+='<div class="panel"><div class="pb" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn" data-act="data"'+(M.ri<0?' disabled':'')+'>'+esc(t('iData'))+'</button><button class="btn sec" data-act="export"'+(M.ri<0?' disabled':'')+'>'+esc(t('iExport'))+'</button><span class="hint" style="flex:1;min-width:200px">'+esc(t('iDataHint'))+'</span><button class="btn danger" data-act="clear"'+(S.files.length?'':' disabled')+'>'+esc(t('iClear'))+'</button></div></div>';
  el.innerHTML=h;
}
function logMsg(txt,bad){var l=$('#log');if(l){var d=document.createElement('div');d.textContent=txt;if(bad)d.style.color='var(--crit)';l.appendChild(d)}}
function toast(msg){var el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true},2600)}
async function handleFiles(list){
  var ok=0;
  for(var i=0;i<list.length;i++){
    var f=list[i];
    try{
      if(/\.json$/i.test(f.name)){var js=JSON.parse(await f.text());if(!js.files)throw new Error('Not a data.json');
        js.files.forEach(function(pf){S.files=S.files.filter(function(x){return x.name!==pf.name&&x.month!==pf.month});S.files.push(pf);ok++});
        if(js.cfg)for(var kk in js.cfg)S.cfg[kk]=js.cfg[kk];logMsg(f.name+' → '+js.files.length);continue}
      if(typeof XLSX==='undefined'){logMsg('Excel reader is not available (offline?).',true);return}
      var buf=await f.arrayBuffer();var pf=parseBook(f.name,buf);
      S.files=S.files.filter(function(x){return x.name!==pf.name&&x.month!==pf.month});S.files.push(pf);ok++;
      logMsg(f.name+' → '+monthLabel(pf.month)+' ('+pf.stats.n+')')}
    catch(e){logMsg(t('iBad')+' '+f.name+': '+(e&&e.message||e),true)}
  }
  S.files.sort(function(a,b){return a.month<b.month?-1:a.month>b.month?1:a.name<b.name?-1:1});
  if(ok){S.reportMonth=null;buildModel();persist();render();var l=$('#log');toast(t('loaded',{n:ok}))}
}
function persist(){if(VIEWER)return;ss(STORE_KEY,JSON.stringify({files:S.files,reportMonth:S.reportMonth,cfg:S.cfg}))}
function persistPref(){ss('sajco_pref',JSON.stringify({lang:S.lang,theme:S.theme}))}

/* ---------- export ---------- */
async function saveFile(name,blob){
  try{if(window.claude&&window.claude.use){var d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:blob});return true}}}
  catch(e){if(e&&e.code==='declined'){toast(t('declined'));return false}}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);return true}catch(e){return false}
}
async function exportReport(){
  var snap={files:S.files,reportMonth:M.months[M.ri],cfg:S.cfg,lang:S.lang};
  var json=JSON.stringify(snap).replace(/</g,'\\u003c');
  var html='<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(T.en.title)+'</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"><style id="app-css">'+CSS_TEXT+'</style><script>window.__SNAP__='+json+';<\/script></head><body><div id="shell">'+SHELL_HTML+'</div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script><script id="app-js">'+APP_JS+'<\/script></body></html>';
  var ok=await saveFile('SAJCO_SC_Report_'+M.months[M.ri]+'.html',new Blob([html],{type:'text/html'}));
  if(ok)toast(t('exported'));
}
async function exportData(){
  var snap={version:1,generated:new Date().toISOString(),files:S.files,reportMonth:M.months[M.ri],cfg:S.cfg};
  var ok=await saveFile('data.json',new Blob([JSON.stringify(snap)],{type:'application/json'}));
  if(ok)toast(t('saved'));
}
async function exportChecks(){
  if(typeof XLSX==='undefined')return;
  var rows=[[t('iMonth'),t('area'),t('pn'),t('pname'),t('sc'),t('crit')+'/'+t('warn')+'/'+t('info'),t('colIssue'),t('colRef'),t('colCur'),t('colDiff')]];
  filteredIssues().forEach(function(x){rows.push([M.months[M.ri],areaName(x.a),x.p,pname(x.p),x.s,t(x.sev),T[S.lang].c[x.code][0],x.ref==null?'':Math.round(x.ref),x.cur==null?'':Math.round(x.cur),x.diff==null?'':(x.code==='HIGH_EFF'?Math.round(x.diff*100)/100:Math.round(x.diff))])});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Checks');
  var out=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  var ok=await saveFile('SAJCO_SC_Checks_'+M.months[M.ri]+'.xlsx',new Blob([out],{type:'application/octet-stream'}));
  if(ok)toast(t('saved'));
}

/* ---------- render + events ---------- */
function render(){
  applyChrome();renderFbar();
  ['dash','move','checks','inputs'].forEach(function(id){$('#v-'+id).hidden=id!==S.tab});
  if(S.tab==='dash')renderDash();else if(S.tab==='move')renderMove();else if(S.tab==='checks')renderChecks();else renderInputs();
}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(b){
    var a=b.getAttribute('data-act'),i=a.indexOf(':'),k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
    if(k==='tab'){S.tab=v;render();window.scrollTo(0,0)}
    else if(k==='area'){if(v==='ALL')S.areas=[];else{var x=S.areas.indexOf(v);if(x>=0)S.areas.splice(x,1);else S.areas.push(v)}S.projects=[];render()}
    else if(k==='sort'){S.sort=S.sort.k===v?{k:v,d:-S.sort.d}:{k:v,d:(v==='s'||v==='pn'||v==='a')?1:-1};renderEffTable()}
    else if(k==='sev'){S.chk.sev=S.chk.sev===v?'':v;renderChecks()}
    else if(k==='rm'){S.files.splice(+v,1);S.reportMonth=null;buildModel();persist();render()}
    else if(k==='clear'){if(confirm(t('iConfirmClear'))){S.files=[];S.reportMonth=null;buildModel();persist();render()}}
    else if(k==='export')exportReport();
    else if(k==='data')exportData();
    else if(k==='xlsx')exportChecks();
    return;
  }
  if(ev.target.id==='bLang'){S.lang=S.lang==='en'?'ar':'en';persistPref();render()}
  else if(ev.target.id==='bTheme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';persistPref();applyChrome()}
  else if(ev.target.closest('#drop')){$('#fin').click()}
});
document.addEventListener('change',function(ev){
  var el=ev.target,c=el.getAttribute&&el.getAttribute('data-chg');
  if(el.id==='fin'){handleFiles(Array.prototype.slice.call(el.files));el.value='';return}
  if(!c)return;
  if(c==='proj'){var i=S.projects.indexOf(el.value);if(el.checked&&i<0)S.projects.push(el.value);if(!el.checked&&i>=0)S.projects.splice(i,1);S.ddOpen=true;render()}
  else if(c==='projAll'){S.projects=[];S.ddOpen=true;render()}
  else if(c==='code'){S.chk.code=el.value;renderCheckHelp();renderCheckList()}
  else if(c==='rmonth'){S.reportMonth=el.value;buildModel();persist();render()}
  else if(c==='fmonth'){if(el.value){S.files[+el.getAttribute('data-i')].month=el.value;S.files.sort(function(a,b){return a.month<b.month?-1:1});buildModel();persist();render()}}
  else if(c==='cfg'){var n=+el.value;if(n>0){S.cfg[el.getAttribute('data-k')]=n;buildModel();persist();render()}}
});
document.addEventListener('input',function(ev){
  var k=ev.target.getAttribute&&ev.target.getAttribute('data-inp');
  if(k==='q'){S.q=ev.target.value;renderEffTable()}else if(k==='cq'){S.chk.q=ev.target.value;renderCheckList()}
});
document.addEventListener('toggle',function(ev){if(ev.target.id==='dd')S.ddOpen=ev.target.open},true);
document.addEventListener('dragover',function(ev){var d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',function(ev){var d=$('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(ev){var d=ev.target.closest&&ev.target.closest('#drop');if(d){ev.preventDefault();d.classList.remove('over');handleFiles(Array.prototype.slice.call(ev.dataTransfer.files))}});
document.addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.id==='drop'){ev.preventDefault();$('#fin').click()}});

/* ---------- boot ---------- */
(async function boot(){
  var pref=null;try{pref=JSON.parse(sg('sajco_pref')||'null')}catch(e){}
  S.lang=(pref&&pref.lang)||(SNAP&&SNAP.lang)||'en';S.theme=(pref&&pref.theme)||'auto';
  var src=null,admin=/admin/.test(location.search+location.hash);
  if(SNAP)src=SNAP;
  else{
    var remote=null;
    try{var r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.ok)remote=await r.json()}catch(e){}
    if(remote&&remote.files&&remote.files.length&&!admin){VIEWER=true;src=remote}
    else{try{src=JSON.parse(sg(STORE_KEY)||'null')}catch(e){src=null}
      if((!src||!src.files||!src.files.length)&&remote&&remote.files)src=remote}
  }
  if(src&&src.files){S.files=src.files;S.reportMonth=src.reportMonth||null;if(src.cfg)for(var k in src.cfg)S.cfg[k]=src.cfg[k]}
  buildModel();
  S.tab=(!VIEWER&&!S.files.length)?'inputs':'dash';
  render();
})();
})();
</script>
</body>
